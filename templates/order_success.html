{% extends 'base.html' %}
{% block content %}
<div class="success-card">
    <div class="success-icon">🎉</div>
    <h2>Thank you for your order!</h2>
    <p>Your order ID is <strong>#{{ order.id }}</strong>.</p>
    <p>We are processing it and will deliver to <strong>{{ order.address }}, {{ order.city }}</strong>.</p>
    <a href="{% url 'product_list' %}" class="btn-primary">Back to Store</a>
</div>
{% endblock %}
