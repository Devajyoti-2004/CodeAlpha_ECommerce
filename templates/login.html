{% extends 'base.html' %}
{% block content %}
<div class="auth-card">
    <h2>Sign In to ShopHub</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary full-width">Login</button>
    </form>
    <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
</div>
{% endblock %}
