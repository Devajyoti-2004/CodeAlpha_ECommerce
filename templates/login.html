{% extends 'base.html' %}

{% block content %}
<style>
  /* Matching Aurora Background & Smooth Card Hover */
  .auth-wrapper {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 2.5rem 1rem;
    overflow: hidden;
  }

  .floating-shape {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.6;
    z-index: 0;
    animation: floatGlow 8s ease-in-out infinite alternate;
  }

  .shape-1 {
    width: 320px;
    height: 320px;
    background: radial-gradient(circle, #6366f1, #8b5cf6);
    top: 5%;
    left: 15%;
  }

  .shape-2 {
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, #ec4899, #f43f5e);
    bottom: 10%;
    right: 15%;
    animation-delay: -4s;
  }

  @keyframes floatGlow {
    0% { transform: translateY(0px) scale(1); }
    100% { transform: translateY(-30px) scale(1.1); }
  }

  .auth-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 1.5rem;
    box-shadow: 0 20px 40px -15px rgba(99, 102, 241, 0.25);
    padding: 2.5rem;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .auth-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 25px 50px -12px rgba(99, 102, 241, 0.35);
  }

  .gradient-title {
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
  }

  .custom-input {
    width: 100%;
    border: 1.5px solid #e2e8f0;
    border-radius: 0.85rem;
    padding: 0.75rem 1rem;
    font-size: 0.95rem;
    color: #1e293b;
    outline: none;
    transition: all 0.25s ease;
    background: #f8fafc;
  }

  .custom-input:focus {
    background: #ffffff;
    border-color: #6366f1;
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
  }

  .btn-gradient {
    width: 100%;
    padding: 0.85rem;
    border: none;
    border-radius: 0.85rem;
    font-weight: 600;
    font-size: 1rem;
    color: #ffffff;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
    background-size: 200% auto;
    box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .btn-gradient:hover {
    background-position: right center;
    transform: translateY(-2px);
    box-shadow: 0 14px 28px -5px rgba(236, 72, 153, 0.45);
    color: #ffffff;
  }

  .form-group-custom {
    margin-bottom: 1.25rem;
  }

  .form-label-custom {
    display: block;
    margin-bottom: 0.4rem;
    font-size: 0.85rem;
    font-weight: 600;
    color: #475569;
    letter-spacing: 0.3px;
  }
</style>

<div class="auth-wrapper">
  <div class="floating-shape shape-1"></div>
  <div class="floating-shape shape-2"></div>

  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center mb-2" 
           style="width: 54px; height: 54px; border-radius: 1rem; background: linear-gradient(135deg, #6366f1, #a855f7); color: white; font-size: 1.5rem; box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);">
        🚀
      </div>
      <h2 class="gradient-title mb-1">Welcome Back</h2>
      <p style="color: #64748b; font-size: 0.9rem;">Sign in to continue your shopping on ShopHub</p>
    </div>

    {% if form.errors %}
      <div style="background-color: #fee2e2; border: 1px solid #fca5a5; color: #b91c1c; border-radius: 0.75rem; padding: 0.75rem 1rem; margin-bottom: 1.25rem; font-size: 0.85rem;">
        Invalid username or password. Please try again.
      </div>
    {% endif %}

    <form method="POST" novalidate>
      {% csrf_token %}

      <div class="form-group-custom">
        <label for="{{ form.username.id_for_label }}" class="form-label-custom">Username</label>
        <input type="text" 
               name="{{ form.username.name }}" 
               id="{{ form.username.id_for_label }}" 
               class="custom-input" 
               placeholder="Enter your username"
               value="{{ form.username.value|default:'' }}"
               required>
      </div>

      <div class="form-group-custom" style="margin-bottom: 1.75rem;">
        <label for="{{ form.password.id_for_label }}" class="form-label-custom">Password</label>
        <input type="password" 
               name="{{ form.password.name }}" 
               id="{{ form.password.id_for_label }}" 
               class="custom-input" 
               placeholder="Enter your password"
               required>
      </div>

      <button type="submit" class="btn-gradient">
        Sign In →
      </button>
    </form>

    <div class="text-center mt-4 pt-3" style="border-top: 1px solid #f1f5f9;">
      <span style="color: #64748b; font-size: 0.88rem;">Don't have an account?</span>
      <a href="{% url 'register' %}" style="color: #6366f1; font-weight: 700; text-decoration: none; margin-left: 0.35rem; font-size: 0.88rem;">Create one here</a>
    </div>
  </div>
</div>
{% endblock %}
